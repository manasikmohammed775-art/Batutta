<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batutta - بطوطة الحقيقية</title>
<meta name="theme-color" content="#FF7A00">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--o:#FF7A00;--l:#FFF1E6;--bg:#FFFBF5}
*{font-family:Tajawal,sans-serif;box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg)}
header{background:linear-gradient(135deg,#FF7A00,#FF9F45);padding:14px;color:#fff;text-align:center;border-radius:0 0 22px 22px;position:sticky;top:0}
#ava{width:68px;height:68px;background:#fff;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-size:38px;transition:.3s}
#ava.talk{animation:t .5s infinite;box-shadow:0 0 0 8px rgba(255,255,255,.3)}
@keyframes t{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.container{max-width:520px;margin:auto;padding:10px 10px 90px}
.card{background:#fff;border-radius:20px;padding:10px;box-shadow:0 4px 20px rgba(0,0,0,.06);border:1px solid #FFE5CC}
.chat{height:55vh;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:6px}
.msg{max-width:85%;padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.7}
.msg.bot{background:var(--l);border:1px solid #FFD6B0;align-self:flex-start;border-bottom-right-radius:6px}
.msg.user{background:var(--o);color:#fff;align-self:flex-end;border-bottom-left-radius:6px}
.quick{display:flex;gap:8px;overflow:auto;padding:8px 2px}
.quick button{white-space:nowrap;background:#fff;border:1.5px solid #FF7A00;color:#FF7A00;padding:7px 12px;border-radius:99px;font-weight:700;font-size:12px;flex-shrink:0}
.controls{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #FFE5CC;padding:10px;max-width:520px;margin:auto;display:flex;gap:8px}
.controls input{flex:1;padding:13px 15px;border-radius:99px;border:1.5px solid #FFD6B0;outline:none}
.btn{width:48px;height:48px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
#mic{background:#FFF1E6;color:#FF7A00;border:1.5px solid #FFD6B0}
#mic.on{background:#FF7A00;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,122,0,.6)}100%{box-shadow:0 0 0 14px rgba(255,122,0,0)}}
#send{background:var(--o);color:#fff}
.s{width:44px;height:26px;background:#ddd;border-radius:99px;position:relative;cursor:pointer}
.s.on{background:#FF7A00}
.s::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.3s}
.s.on::after{left:21px}
</style>
</head>
<body>
<header>
<div id="ava">🦆</div>
<div style="font-weight:900;font-size:20px;margin-top:4px">Batutta - بطوطة الذكية</div>
<div id="st" style="font-size:11px;background:rgba(0,0,0,.15);display:inline-block;padding:2px 10px;border-radius:99px;margin-top:4px">● متصلة - اضغطي الميكروفون</div>
</header>
<div class="container">
<div class="card">
<div style="display:flex;justify-content:space-between;padding:6px 2px;font-size:12px"><span>🔊 رد صوتي</span><div id="vt" class="s on" onclick="this.classList.toggle('on');voice=!voice"></div></div>
<div id="chat" class="chat">
<div class="msg bot">أهلا يا مناسك! أنا بطوطة الحقيقية 🧡🦆<br><br>🎤 بتكلمي معاي بصوتك<br>🔊 برد ليك بصوتي<br>💾 بتذكر كلامنا<br><br>اضغطي الميكروفون وقولي: عايزة علاج في مصر</div>
</div>
<div class="quick">
<button onclick="ask('علاج في مصر')">🏥 علاج</button>
<button onclick="ask('منح تركيا')">🎓 منح</button>
<button onclick="ask('سياحة دبي')">✈️ سياحة</button>
<button onclick="ask('شغل السعودية')">💼 شغل</button>
<button onclick="ask('احجزي لي')">📅 احجزي</button>
</div>
</div>
</div>
<div class="controls">
<button id="mic" class="btn" onclick="toggleMic()">🎤</button>
<input id="inp" placeholder="اكتبي أو اضغطي الميكروفون..." onkeydown="if(event.key==='Enter')send()">
<button id="send" class="btn" onclick="send()">➤</button>
</div>
<script>
let voice=true,rec,listen=false,synth=window.speechSynthesis,arVoice=null;
function initV(){let v=synth.getVoices();arVoice=v.find(x=>x.lang.includes('ar'))||v[0]}
if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=initV;initV();
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){rec=new SR();rec.lang='ar-SA';rec.onstart=()=>{listen=true;mic.classList.add('on');st.innerText='🎤 بسمعك...';ava.classList.add('talk')};rec.onend=()=>{listen=false;mic.classList.remove('on');st.innerText='● متصلة';ava.classList.remove('talk')};rec.onresult=e=>{inp.value=e.results[0][0].transcript;send()}}
function toggleMic(){if(!rec){alert('استخدمي Chrome');return}if(listen)rec.stop();else rec.start()}
function speak(t){if(!voice)return;synth.cancel();let u=new SpeechSynthesisUtterance(t.replace(/<br>/g,' ').substring(0,280));u.lang='ar-SA';u.rate=.95;u.pitch=1.15;if(arVoice)u.voice=arVoice;u.onstart=()=>{ava.classList.add('talk');st.innerText='🔊 بطوطة بتتكلم'};u.onend=()=>{ava.classList.remove('talk');st.innerText='● متصلة'};synth.speak(u)}
const chat=document.getElementById('chat'),inp=document.getElementById('inp'),st=document.getElementById('st'),ava=document.getElementById('ava'),mic=document.getElementById('mic');
function addMsg(t,w){let d=document.createElement('div');d.className='msg '+w;d.innerHTML=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;localStorage.setItem('bat_chat',chat.innerHTML);if(w=='bot')speak(t)}
function botReply(q){let l=q.toLowerCase(),a="فهمتك: "+q+"<br><br>قولي الدولة والميزانية وانا بجهز خطة كاملة 🧡";if(l.includes('علاج')||l.includes('مصر'))a="للعلاج في مصر 🇪🇬<br>🏥 معهد ناصر - قلب<br>🏥 دار الفؤاد - أورام<br>💰 2000-5000$ شامل السكن والترجمة<br>📄 جواز + تقارير<br><br>أحجز ليك؟ قولي احجزي";else if(l.includes('منح')||l.includes('تركيا')||l.includes('تعليم'))a="منح تركيا الممولة 2026 🇹🇷<br>✅ راتب 350$ + سكن + تذكرة<br>📝 بكتب ليك خطاب نية بالـAI<br>نسبتك كم؟";else if(l.includes('سياحة')||l.includes('دبي'))a="رحلة دبي قروب برتقالي 🧡<br>💰 800$ شامل طيران + فندق 4 نجوم<br>👥 باقي 3 مقاعد!<br>تحجزي؟";else if(l.includes('شغل')||l.includes('عمل'))a="وظائف السعودية 💼<br>ممرضات 4000 ريال<br>معلمات 5000 ريال<br>بجهز ليك CV برتقالي + تدريب صوتي 🎤<br>مجالك شنو؟";else if(l.includes('احجزي')||l.includes('حجز'))a="تمام! أرسلي الاسم + واتساب + الدولة<br>وأحولك لواتساب الحجز 🟢";setTimeout(()=>addMsg(a,'bot'),700)}
function send(){if(!inp.value.trim())return;addMsg(inp.value,'user');botReply(inp.value);inp.value=''}
function ask(t){inp.value=t;send()}
let h=localStorage.getItem('bat_chat');if(h&&h.length>200)chat.innerHTML=h;
setTimeout(()=>{if(!localStorage.getItem('wel')){speak('أهلا يا مناسك أنا بطوطة الحقيقية بقدر أسمعك وأرد بصوتي');localStorage.setItem('wel','1')}},1200);
</script>
</body>
</html>
